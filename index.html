  { id: '381170', ticker: '381170', name: 'TIGER 미국테크TOP10',     type: '해외 ETF', shares: 117, avgPrice: 31643,  currentPrice: 32200,   color: '#f59e0b' },
  { id: '446770', ticker: '446770', name: 'ACE 글로벌반도체TOP4 Plus', type: '해외 ETF', shares: 57,  avgPrice: 44854,  currentPrice: 68500,   color: '#10b981' },
  { id: '490090', ticker: '490090', name: 'TIGER 미국AI빅테크10',    type: '해외 ETF', shares: 100, avgPrice: 12105,  currentPrice: 16250,   color: '#a855f7' },
];

// ──────────────────────────────────────────────────────────
// 유틸
// ──────────────────────────────────────────────────────────
const fmtKRW = (n) => new Intl.NumberFormat('ko-KR').format(Math.round(n || 0));
const fmtPct = (n) => (n >= 0 ? '+' : '') + (n || 0).toFixed(2) + '%';
const fmtKRWCompact = (n) => {
  const v = Math.abs(n);
  if (v >= 100000000) return (n / 100000000).toFixed(2) + '억';
  if (v >= 10000)     return (n / 10000).toFixed(1) + '만';
  return fmtKRW(n);
};
const fmtTime = (iso) => {
  try {
    const d = new Date(iso);
    return d.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  } catch { return '-'; }
};
const fmtTimeShort = (iso) => {
  try {
    const d = new Date(iso);
    return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  } catch { return '-'; }
};
const profitColor = (v) => v > 0 ? '#f43f5e' : v < 0 ? '#3b82f6' : '#94a3b8';
const profitBg    = (v) => v > 0 ? 'rgba(244, 63, 94, 0.08)' : v < 0 ? 'rgba(59, 130, 246, 0.08)' : 'rgba(148, 163, 184, 0.08)';
const naverURL = (ticker) => `https://m.stock.naver.com/domestic/stock/${ticker}/total`;

const Store = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};

// ──────────────────────────────────────────────────────────
// 한국 장중 여부 (KST 평일 09:00 ~ 15:30)
// ──────────────────────────────────────────────────────────
function getMarketStatus() {
  const now = new Date();
  const kst = new Date(now.getTime() + (now.getTimezoneOffset() + 9 * 60) * 60000);
  const day = kst.getDay();
  const hour = kst.getHours();
  const minute = kst.getMinutes();
  const totalMin = hour * 60 + minute;

  if (day === 0 || day === 6) return { isOpen: false, label: '주말 휴장' };
  if (totalMin < 9 * 60)  return { isOpen: false, label: '장 시작 전' };
  if (totalMin > 15 * 60 + 30) return { isOpen: false, label: '장 마감' };
  return { isOpen: true, label: '장중' };
}

// ──────────────────────────────────────────────────────────
// Worker에 가격 요청
// ──────────────────────────────────────────────────────────
async function fetchPrices(tickers) {
  const url = `${WORKER_URL}/?tickers=${tickers.join(',')}&_t=${Date.now()}`;

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 10000);

  try {
    const res = await fetch(url, { signal: controller.signal, cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (!data.ok || !data.prices) throw new Error('Invalid response');
    return data.prices;
  } finally {
    clearTimeout(timeoutId);
  }
}

function useWindowWidth() {
  const [w, setW] = useState(typeof window !== 'undefined' ? window.innerWidth : 1000);
  useEffect(() => {
    const onR = () => setW(window.innerWidth);
    window.addEventListener('resize', onR);
    return () => window.removeEventListener('resize', onR);
  }, []);
  return w;
}

// ──────────────────────────────────────────────────────────
// 메인
// ──────────────────────────────────────────────────────────
function Dashboard() {
  const width = useWindowWidth();
  const isCompact = width < 500;
  const isMini = width < 360;

  const [holdings, setHoldings] = useState(INITIAL_HOLDINGS);
  const [history, setHistory]   = useState([]);
  const [lastUpdate, setLastUpdate] = useState(null);
  const [hideAmounts, setHideAmounts] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editValue, setEditValue] = useState('');
  const [priceChanges, setPriceChanges] = useState({});

  const [autoRefresh, setAutoRefresh] = useState(true);
  const [fetching, setFetching]       = useState(false);
  const [fetchError, setFetchError]   = useState(null);
  const [marketStatus, setMarketStatus] = useState(getMarketStatus());
  const [secondsUntilNext, setSecondsUntilNext] = useState(REFRESH_INTERVAL_MS / 1000);

  const holdingsRef = useRef(holdings);
  const historyRef  = useRef(history);
  const fetchingRef = useRef(false);
  useEffect(() => { holdingsRef.current = holdings; }, [holdings]);
  useEffect(() => { historyRef.current = history; }, [history]);

  useEffect(() => {
    const h = Store.get('mystock:holdings');
    if (h) try {
      const parsed = JSON.parse(h);
      if (Array.isArray(parsed) && parsed.length) setHoldings(parsed);
    } catch {}
    const hist = Store.get('mystock:history');
    if (hist) try { const p = JSON.parse(hist); if (Array.isArray(p)) setHistory(p); } catch {}
    const t = Store.get('mystock:lastUpdate');
    if (t) setLastUpdate(t);
    const ar = Store.get('mystock:autoRefresh');
    if (ar !== null) setAutoRefresh(ar === 'true');
  }, []);

  const persist = (H, hist, t) => {
    if (H)    Store.set('mystock:holdings', JSON.stringify(H));
    if (hist) Store.set('mystock:history', JSON.stringify(hist));
    if (t)    Store.set('mystock:lastUpdate', t);
  };

  const refreshPrices = useCallback(async (silent = false) => {
    if (fetchingRef.current) return;
    fetchingRef.current = true;
    setFetching(true);

    try {
      const tickers = holdingsRef.current.map(h => h.ticker);
      const priceMap = await fetchPrices(tickers);

      const changes = {};
      const updated = holdingsRef.current.map(h => {
        const info = priceMap[h.ticker];
        if (!info || info.error) return h;
        const newPrice = Number(info.price);
        if (!Number.isFinite(newPrice) || newPrice <= 0) return h;
        if (Math.round(newPrice) !== Math.round(h.currentPrice)) {
          changes[h.id] = newPrice > h.currentPrice ? 'up' : 'down';
        }
        return { ...h, currentPrice: Math.round(newPrice) };
      });

      const now = new Date().toISOString();
      const newTotal = updated.reduce((s, h) => s + h.currentPrice * h.shares, 0);
      const newCost  = updated.reduce((s, h) => s + h.avgPrice * h.shares, 0);

      const last = historyRef.current[historyRef.current.length - 1];
      let newHistory = historyRef.current;
      if (!last || (new Date(now) - new Date(last.t)) > 5000) {
        newHistory = [...historyRef.current, { t: now, total: newTotal, cost: newCost }].slice(-500);
      }

      setHoldings(updated);
      setHistory(newHistory);
      setLastUpdate(now);
      setPriceChanges(changes);
      setFetchError(null);
      persist(updated, newHistory, now);

      setTimeout(() => setPriceChanges({}), 1500);
    } catch (e) {
      console.error('가격 가져오기 실패:', e);
      setFetchError(e.message || '시세 조회 실패');
    } finally {
      fetchingRef.current = false;
      setFetching(false);
    }
  }, []);

  useEffect(() => {
    if (!autoRefresh) return;
    const initialTimer = setTimeout(() => refreshPrices(true), 1000);
    const interval = setInterval(() => refreshPrices(true), REFRESH_INTERVAL_MS);
    return () => { clearTimeout(initialTimer); clearInterval(interval); };
  }, [autoRefresh, refreshPrices]);

  useEffect(() => {
    const tick = setInterval(() => {
      setMarketStatus(getMarketStatus());
      if (autoRefresh && lastUpdate) {
        const elapsed = (Date.now() - new Date(lastUpdate).getTime()) / 1000;
        const remaining = Math.max(0, Math.ceil(REFRESH_INTERVAL_MS / 1000 - elapsed));
        setSecondsUntilNext(remaining);
      }
    }, 1000);
    return () => clearInterval(tick);
  }, [autoRefresh, lastUpdate]);

  const toggleAutoRefresh = () => {
    const newVal = !autoRefresh;
    setAutoRefresh(newVal);
    Store.set('mystock:autoRefresh', String(newVal));
  };

  const totals = useMemo(() => {
    const cost  = holdings.reduce((s, h) => s + h.avgPrice * h.shares, 0);
    const value = holdings.reduce((s, h) => s + h.currentPrice * h.shares, 0);
    const profit = value - cost;
    const pct = cost > 0 ? (profit / cost) * 100 : 0;
    return { cost, value, profit, pct };
  }, [holdings]);

  const allocation = useMemo(() => holdings.map(h => ({
    name: h.name, value: h.currentPrice * h.shares, color: h.color
  })).filter(a => a.value > 0), [holdings]);

  const profitByStock = useMemo(() => holdings.map(h => {
    const profit = (h.currentPrice - h.avgPrice) * h.shares;
    const pct = h.avgPrice > 0 ? ((h.currentPrice - h.avgPrice) / h.avgPrice) * 100 : 0;
    return {
      name: h.name.length > 8 ? h.name.slice(0, 8) + '…' : h.name,
      fullName: h.name, profit, pct: Number(pct.toFixed(2)),
      color: profitColor(profit),
    };
  }), [holdings]);

  const startEdit = (h) => { setEditingId(h.id); setEditValue(String(h.currentPrice)); };
  const saveEdit = () => {
    const v = Number(editValue.replace(/[,\s]/g, ''));
    if (!Number.isFinite(v) || v <= 0) { setEditingId(null); return; }
    const updated = holdings.map(h => h.id === editingId ? { ...h, currentPrice: v } : h);
    setHoldings(updated);
    persist(updated, null, null);
    setEditingId(null);
  };

  const resetHistory = () => {
    if (!window.confirm('기록을 모두 삭제할까요?')) return;
    setHistory([]);
    Store.set('mystock:history', JSON.stringify([]));
  };

  const containerPad = isMini ? 'px-3 py-3' : isCompact ? 'px-4 py-4' : 'px-4 sm:px-6 py-6';
  const sectionPad = isMini ? 'p-3' : isCompact ? 'p-4' : 'p-5 sm:p-6';

  return (
    <div className="min-h-screen text-slate-100 pb-20" style={{
      background: 'radial-gradient(ellipse at top, #0f172a 0%, #020617 50%, #000 100%)'
    }}>
      <header className="sticky top-0 z-40 backdrop-blur-xl bg-slate-950/70 border-b border-slate-800/60">
        <div className={`max-w-5xl mx-auto ${isMini ? 'px-3 py-3' : 'px-4 sm:px-6 py-4'} flex items-center justify-between`}>
          <div className="flex items-center gap-2">
            <div className={`${isMini ? 'w-7 h-7' : 'w-8 h-8'} rounded-lg bg-gradient-to-br from-amber-400 to-amber-600 flex items-center justify-center shadow-lg shadow-amber-500/20`}>
              <I_Wallet size={isMini ? 14 : 16} className="text-slate-950" />
            </div>
            <div>
              <div className="text-[9px] uppercase tracking-[0.2em] text-slate-500 font-medium flex items-center gap-1">
                Live
                {autoRefresh && !fetchError && <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 live-dot"/>}
                {autoRefresh && fetchError && <span className="w-1.5 h-1.5 rounded-full bg-rose-500"/>}
                {!autoRefresh && <span className="w-1.5 h-1.5 rounded-full bg-slate-600"/>}
              </div>
              <div className={`${isMini ? 'text-xs' : 'text-sm'} font-semibold text-slate-100 -mt-0.5`}>MY 포트폴리오</div>
            </div>
          </div>
          <div className="flex items-center gap-1.5">
            <button onClick={() => setHideAmounts(v => !v)} className="p-1.5 rounded-lg hover:bg-slate-800/60">
              {hideAmounts ? <I_EyeOff size={14} className="text-slate-400"/> : <I_Eye size={14} className="text-slate-400"/>}
            </button>
            <button
              onClick={toggleAutoRefresh}
              className={`flex items-center gap-1 ${isMini ? 'px-2 py-1.5' : 'px-2.5 py-1.5'} rounded-lg ${isMini ? 'text-[10px]' : 'text-xs'} font-semibold transition ${
                autoRefresh ? 'bg-emerald-500/20 text-emerald-400 hover:bg-emerald-500/30' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'
              }`}
            >
              {autoRefresh ? <I_Pause size={11}/> : <I_Play size={11}/>}
              {isMini ? '' : (autoRefresh ? '자동' : '수동')}
            </button>
            <button
              onClick={() => refreshPrices(false)}
              disabled={fetching}
              className={`flex items-center gap-1 ${isMini ? 'px-2.5 py-1.5' : 'px-3 py-2'} rounded-lg bg-gradient-to-br from-amber-400 to-amber-600 text-slate-950 ${isMini ? 'text-[11px]' : 'text-xs'} font-bold shadow-lg shadow-amber-500/20 active:scale-95 disabled:opacity-60`}
            >
              <I_Refresh size={12} className={fetching ? 'animate-spin' : ''}/>
              {isMini ? '' : '새로고침'}
            </button>
          </div>
        </div>

        <div className={`max-w-5xl mx-auto ${isMini ? 'px-3 pb-2' : 'px-4 sm:px-6 pb-2'} flex items-center justify-between text-[10px]`}>
          <div className="flex items-center gap-2 text-slate-500">
            <span className={`px-1.5 py-0.5 rounded font-semibold ${
              marketStatus.isOpen ? 'bg-rose-500/20 text-rose-400' : 'bg-slate-700/50 text-slate-400'
            }`}>
              {marketStatus.isOpen && <span className="inline-block w-1 h-1 rounded-full bg-rose-400 mr-1 live-dot"/>}
              {marketStatus.label}
            </span>
            {lastUpdate && <span className="num">갱신 {fmtTimeShort(lastUpdate)}</span>}
          </div>
          <div className="text-slate-500">
            {fetchError ? (
              <span className="text-rose-400 flex items-center gap-1">
                <I_WifiOff size={10}/>{isMini ? '연결 실패' : '연결 실패 - 재시도 중'}
              </span>
            ) : autoRefresh ? (
              <span className="flex items-center gap-1">
                <I_Wifi size={10} className="text-emerald-400"/>
                {fetching ? '갱신 중…' : `다음 갱신 ${secondsUntilNext}초 후`}
              </span>
            ) : (
              <span>자동 갱신 정지됨</span>
            )}
          </div>
        </div>
      </header>

      <main className={`max-w-5xl mx-auto ${containerPad} space-y-4`}>
        <section className="relative overflow-hidden rounded-2xl border border-slate-800/60" style={{
          background: 'linear-gradient(135deg, rgba(15,23,42,0.9) 0%, rgba(2,6,23,0.95) 100%)'
        }}>
          <div className="absolute -top-24 -right-24 w-64 h-64 rounded-full opacity-20 blur-3xl" style={{
            background: totals.profit >= 0
              ? 'radial-gradient(circle, #f43f5e 0%, transparent 70%)'
              : 'radial-gradient(circle, #3b82f6 0%, transparent 70%)'
          }} />
          <div className="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-amber-400/30 to-transparent" />

          <div className={`relative ${sectionPad}`}>
            <div className="flex items-center justify-between mb-1">
              <div className="text-[10px] uppercase tracking-[0.25em] text-slate-500 font-medium">Total Valuation</div>
              <div className="flex items-center gap-1 text-[9px] text-slate-500">
                <I_Clock size={10}/>{lastUpdate ? fmtTime(lastUpdate) : '미갱신'}
              </div>
            </div>

            <div className="mt-2 flex items-baseline gap-2">
              <span className={`num ${isMini ? 'text-3xl' : isCompact ? 'text-4xl' : 'text-5xl sm:text-6xl'} font-bold tracking-tight text-slate-50`} style={{ fontFamily: 'Georgia, serif' }}>
                {hideAmounts ? '•••••' : (isMini ? fmtKRWCompact(totals.value) : fmtKRW(totals.value))}
              </span>
              <span className={`${isMini ? 'text-sm' : 'text-lg'} font-medium text-slate-400`}>원</span>
            </div>

            <div className="mt-3 flex flex-wrap items-center gap-1.5">
              <div className={`inline-flex items-center gap-1 ${isMini ? 'px-2 py-1 text-[11px]' : 'px-3 py-1.5 text-sm'} rounded-full font-bold`}
                   style={{ color: profitColor(totals.profit), backgroundColor: profitBg(totals.profit) }}>
                {totals.profit > 0 ? <I_TrendUp size={isMini ? 10 : 14}/> : totals.profit < 0 ? <I_TrendDown size={isMini ? 10 : 14}/> : null}
                {hideAmounts ? '••' : (totals.profit >= 0 ? '+' : '') + (isMini ? fmtKRWCompact(totals.profit) : fmtKRW(totals.profit))}원
              </div>
              <div className={`inline-flex items-center ${isMini ? 'px-2 py-1 text-[11px]' : 'px-3 py-1.5 text-sm'} rounded-full font-bold`}
                   style={{ color: profitColor(totals.profit), backgroundColor: profitBg(totals.profit) }}>
                {fmtPct(totals.pct)}
              </div>
            </div>

            {!isMini && (
              <div className="mt-4 pt-4 border-t border-slate-800/60 grid grid-cols-2 gap-3">
                <div>
                  <div className="text-[9px] uppercase tracking-wider text-slate-500 font-medium">매입원가</div>
                  <div className="num mt-0.5 text-sm font-semibold text-slate-300">{hideAmounts ? '•••••' : fmtKRW(totals.cost)}원</div>
                </div>
                <div>
                  <div className="text-[9px] uppercase tracking-wider text-slate-500 font-medium">보유 종목</div>
                  <div className="num mt-0.5 text-sm font-semibold text-slate-300">{holdings.length}종목</div>
                </div>
              </div>
            )}
          </div>
        </section>

        {!isMini && (
          <section className={`rounded-2xl border border-slate-800/60 bg-slate-900/40 ${sectionPad}`}>
            <div className="flex items-center justify-between mb-3">
              <div className="flex items-center gap-2">
                <I_Line size={14} className="text-amber-400"/>
                <h2 className="text-xs font-bold text-slate-200">실시간 추이</h2>
              </div>
              <div className="flex items-center gap-2">
                <span className="text-[9px] text-slate-500">{history.length}개 기록</span>
                {history.length > 0 && (
                  <button onClick={resetHistory} className="text-[9px] text-slate-500 hover:text-rose-400 underline">초기화</button>
                )}
              </div>
            </div>

            {history.length < 2 ? (
              <div className="flex flex-col items-center justify-center py-8 text-center">
                <I_Sparkle size={24} className="text-slate-700 mb-2"/>
                <div className="text-xs text-slate-400">자동 갱신 중… 잠시만 기다리시면 그래프가 그려져요</div>
              </div>
            ) : (
              <div className={`${isCompact ? 'h-48' : 'h-56'} -mx-2`}>
                <ResponsiveContainer width="100%" height="100%">
                  <AreaChart data={history.map(h => ({ time: fmtTimeShort(h.t), 평가금액: h.total, 매입원가: h.cost }))}>
                    <defs>
                      <linearGradient id="gradV" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stopColor="#fbbf24" stopOpacity={0.35}/>
                        <stop offset="100%" stopColor="#fbbf24" stopOpacity={0}/>
                      </linearGradient>
                    </defs>
                    <CartesianGrid stroke="#1e293b" strokeDasharray="3 3" vertical={false}/>
                    <XAxis dataKey="time" tick={{ fill: '#64748b', fontSize: 9 }} axisLine={false} tickLine={false}/>
                    <YAxis tick={{ fill: '#64748b', fontSize: 9 }} axisLine={false} tickLine={false}
                           tickFormatter={(v) => (v / 10000).toFixed(0) + '만'}
                           domain={['dataMin - 50000', 'dataMax + 50000']} width={40}/>
                    <Tooltip contentStyle={{ backgroundColor: '#020617', border: '1px solid #334155', borderRadius: 8, fontSize: 11 }}
                             labelStyle={{ color: '#94a3b8', fontSize: 10 }}
                             formatter={(v) => [fmtKRW(v) + '원', '']}/>
                    <Line type="monotone" dataKey="매입원가" stroke="#475569" strokeWidth={1.5} strokeDasharray="4 4" dot={false}/>
                    <Area type="monotone" dataKey="평가금액" stroke="#fbbf24" strokeWidth={2.5} fill="url(#gradV)" dot={false} activeDot={{ r: 4 }}/>
                  </AreaChart>
                </ResponsiveContainer>
              </div>
            )}
          </section>
        )}

        <section className="rounded-2xl border border-slate-800/60 bg-slate-900/40 overflow-hidden">
          <div className={`${sectionPad} pb-2 flex items-center justify-between`}>
            <h2 className="text-xs font-bold text-slate-200">보유 종목</h2>
            <span className="text-[9px] text-slate-500">현재가 탭 → 직접 수정</span>
          </div>

          <div className="divide-y divide-slate-800/60">
            {holdings.map(h => {
              const value  = h.currentPrice * h.shares;
              const cost   = h.avgPrice * h.shares;
              const profit = value - cost;
              const pct    = cost > 0 ? (profit / cost) * 100 : 0;
              const change = priceChanges[h.id];
              const flashClass = change === 'up' ? 'flash-up' : change === 'down' ? 'flash-down' : '';
              return (
                <div key={h.id} className={`${isMini ? 'px-3 py-2.5' : 'px-4 sm:px-6 py-3'} hover:bg-slate-900/60 transition-colors ${flashClass}`}>
                  <div className="flex items-start gap-2">
                    <div className="w-0.5 h-9 rounded-full flex-shrink-0 mt-1" style={{ backgroundColor: h.color }}/>
                    <div className="flex-1 min-w-0">
                      <div className="flex items-start justify-between gap-2">
                        <div className="min-w-0">
                          <div className={`font-semibold ${isMini ? 'text-xs' : 'text-sm'} text-slate-100 truncate`}>{h.name}</div>
                          <div className="text-[9px] text-slate-500 mt-0.5 flex items-center gap-1">
                            <span className="num">{h.ticker}</span>
                            <span className="text-slate-700">·</span>
                            <span>{h.shares}주</span>
                            <a href={naverURL(h.ticker)} target="_blank" rel="noopener"
                               className="ml-0.5 text-amber-500/70 hover:text-amber-400" title="네이버 금융">
                              <I_External size={10}/>
                            </a>
                          </div>
                        </div>
                        <div className="text-right flex-shrink-0">
                          <div className={`num ${isMini ? 'text-xs' : 'text-sm'} font-bold text-slate-100`}>
                            {hideAmounts ? '•••••' : (isMini ? fmtKRWCompact(value) : fmtKRW(value))}
                          </div>
                          <div className="text-[10px] font-bold mt-0.5" style={{ color: profitColor(profit) }}>
                            {hideAmounts ? '••' : (profit >= 0 ? '+' : '') + (isMini ? fmtKRWCompact(profit) : fmtKRW(profit))} ({fmtPct(pct)})
                          </div>
                        </div>
                      </div>
                      <div className="mt-1.5 flex items-center justify-between text-[10px]">
                        <div className="text-slate-500">평단 <span className="num text-slate-400">{fmtKRW(h.avgPrice)}</span></div>
                        {editingId === h.id ? (
                          <div className="flex items-center gap-1">
                            <input autoFocus value={editValue} onChange={(e) => setEditValue(e.target.value)}
                                   onKeyDown={(e) => { if (e.key === 'Enter') saveEdit(); if (e.key === 'Escape') setEditingId(null); }}
                                   className="w-20 px-1.5 py-0.5 rounded bg-slate-800 text-slate-100 text-[10px] font-mono border border-amber-500/50 focus:outline-none"/>
                            <button onClick={saveEdit} className="p-0.5 rounded bg-amber-500 text-slate-950"><I_Check size={10}/></button>
                            <button onClick={() => setEditingId(null)} className="p-0.5 rounded bg-slate-700 text-slate-300"><I_X size={10}/></button>
                          </div>
                        ) : (
                          <button onClick={() => startEdit(h)}
                                  className={`flex items-center gap-0.5 px-1.5 py-0.5 rounded transition-all num font-semibold ${
                                    change === 'up'   ? 'bg-rose-500/20 text-rose-400' :
                                    change === 'down' ? 'bg-blue-500/20 text-blue-400' :
                                    'text-slate-300 hover:bg-slate-800'
                                  }`}>
                            {change === 'up'   && <I_TrendUp size={9}/>}
                            {change === 'down' && <I_TrendDown size={9}/>}
                            {fmtKRW(h.currentPrice)}
                          </button>
                        )}
                      </div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </section>

        {!isCompact && (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <section className={`rounded-2xl border border-slate-800/60 bg-slate-900/40 ${sectionPad}`}>
              <div className="flex items-center gap-2 mb-3">
                <I_Pie size={14} className="text-amber-400"/>
                <h2 className="text-xs font-bold text-slate-200">자산 배분</h2>
              </div>
              <div className="h-48">
                <ResponsiveContainer width="100%" height="100%">
                  <PieChart>
                    <Pie data={allocation} dataKey="value" nameKey="name" innerRadius={40} outerRadius={70} paddingAngle={2} stroke="none">
                      {allocation.map((a, i) => <Cell key={i} fill={a.color}/>)}
                    </Pie>
                    <Tooltip contentStyle={{ backgroundColor: '#020617', border: '1px solid #334155', borderRadius: 8, fontSize: 11 }}
                             formatter={(v, n) => [fmtKRW(v) + '원', n]}/>
                  </PieChart>
                </ResponsiveContainer>
              </div>
              <div className="mt-2 space-y-1">
                {allocation.map((a, i) => {
                  const pct = totals.value > 0 ? (a.value / totals.value) * 100 : 0;
                  return (
                    <div key={i} className="flex items-center justify-between text-[10px]">
                      <div className="flex items-center gap-1.5 min-w-0">
                        <div className="w-2 h-2 rounded-sm flex-shrink-0" style={{ backgroundColor: a.color }}/>
                        <span className="text-slate-400 truncate">{a.name}</span>
                      </div>
                      <span className="num text-slate-300 font-semibold">{pct.toFixed(1)}%</span>
                    </div>
                  );
                })}
              </div>
            </section>

            <section className={`rounded-2xl border border-slate-800/60 bg-slate-900/40 ${sectionPad}`}>
              <div className="flex items-center gap-2 mb-3">
                <I_TrendUp size={14} className="text-amber-400"/>
                <h2 className="text-xs font-bold text-slate-200">종목별 수익률</h2>
              </div>
              <div className="h-48">
                <ResponsiveContainer width="100%" height="100%">
                  <BarChart data={profitByStock} layout="vertical" margin={{ left: 0, right: 16 }}>
                    <CartesianGrid stroke="#1e293b" strokeDasharray="3 3" horizontal={false}/>
                    <XAxis type="number" tick={{ fill: '#64748b', fontSize: 9 }} axisLine={false} tickLine={false} tickFormatter={(v) => v + '%'}/>
                    <YAxis type="category" dataKey="name" tick={{ fill: '#94a3b8', fontSize: 9 }} axisLine={false} tickLine={false} width={80}/>
                    <Tooltip contentStyle={{ backgroundColor: '#020617', border: '1px solid #334155', borderRadius: 8, fontSize: 11 }}
                             formatter={(v, _n, p) => [v + '% (' + fmtKRW(p.payload.profit) + '원)', p.payload.fullName]}/>
                    <Bar dataKey="pct" radius={[0, 6, 6, 0]}>
                      {profitByStock.map((p, i) => <Cell key={i} fill={p.color}/>)}
                    </Bar>
                  </BarChart>
                </ResponsiveContainer>
              </div>
            </section>
          </div>
        )}

        {!isMini && (
          <section className="flex items-start gap-2 p-3 rounded-xl bg-slate-900/40 border border-slate-800/60">
            <I_Lock size={12} className="text-amber-400 flex-shrink-0 mt-0.5"/>
            <div className="text-[10px] text-slate-400 leading-relaxed">
              <span className="text-slate-200 font-semibold">자동 갱신 ON</span> · 30초마다 네이버 금융 데이터로 자동 업데이트
              <br/>
              <span className="text-slate-500">데이터는 브라우저에만 저장 · 시세는 참고용</span>
            </div>
          </section>
        )}
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Dashboard/>);
document.getElementById('loading').style.display = 'none';
</script>

</body>
</html>
